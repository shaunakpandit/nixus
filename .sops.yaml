# Public age recipients for secrets/. Public keys are not secret.
keys:
  # Personal key for editing secrets: age-keygen -y ~/.config/sops/age/keys.txt
  - &void age1_REPLACE_WITH_PERSONAL_PUBLIC_KEY
  # Host keys: ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
  - &d4080 age1_REPLACE_WITH_D4080_HOST_KEY
creation_rules:
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *void
          - *d4080
